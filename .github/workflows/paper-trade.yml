name: paper-trade

on:
  schedule:
    # 16:45 UTC = 17:45 (winter) / 18:45 (summer) in Oslo, i.e. after the close all year.
    - cron: "45 16 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "tests/**", "requirements*.txt"]

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (a failing test blocks trading)
        run: python -m pytest -q
      - name: Advance simulated portfolio
        if: github.event_name != 'push'
        run: python -m app.run_daily --provider yahoo
      - name: Commit state
        if: github.event_name != 'push'
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ docs/data.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push
      - name: Show report
        if: github.event_name != 'push'
        run: cat state/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
