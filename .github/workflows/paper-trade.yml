name: paper-trade

on:
  schedule:
    # 17:15 UTC = 18:15 (winter) / 19:15 (summer) in Oslo: after the close all year, and
    # after aksjescore's own daily job (16:30 UTC) has had time to finish.
    - cron: "15 17 * * 1-5"
    # Second evening run: GitHub can start scheduled jobs hours late, or skip one.
    - cron: "15 19 * * 1-5"
    # Catch-up next morning: Yahoo sometimes publishes the close late, and GitHub can start
    # the evening run hours late. A second run does nothing if the day is already booked.
    - cron: "30 5 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "tests/**", "requirements*.txt", "config.yaml", "docs/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      AKSJESCORE_TOKEN: ${{ secrets.AKSJESCORE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (a failing test blocks trading)
        run: python -m pytest -q
      # Optional: needs a repository secret AKSJESCORE_TOKEN (read access to Antennmast/aksjescore).
      - name: Fetch aksjescore
        if: github.event_name != 'push' && env.AKSJESCORE_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: Antennmast/aksjescore
          token: ${{ secrets.AKSJESCORE_TOKEN }}
          path: _aksjescore
          sparse-checkout: pipeline/aksjescore.db
          sparse-checkout-cone-mode: false
      - name: Import sentiment scores
        if: github.event_name != 'push' && env.AKSJESCORE_TOKEN != ''
        run: python -m app.import_aksjescore _aksjescore/pipeline/aksjescore.db
      - name: Advance simulated portfolio
        if: github.event_name != 'push'
        run: python -m app.run_daily --provider yahoo
      - name: Commit state
        if: github.event_name != 'push'
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ docs/data.json signals/scores.csv signals/llm_scores.csv
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push
      # The website is served from the gh-pages branch, which mirrors docs/.
      - name: Publish website
        run: git push origin "$(git subtree split --prefix docs HEAD)":refs/heads/gh-pages --force
      - name: Show report
        if: github.event_name != 'push'
        run: cat state/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      # Alert: a failed scheduled or manual run opens (or updates) an issue, which GitHub
      # e-mails to the repository owner.
      - name: Alert on failure
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daglig kjøring feilet"
          body="Den daglige kjøringen feilet $(date -u +%F). Porteføljene er ikke oppdatert. Logg: $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
